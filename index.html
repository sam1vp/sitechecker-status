<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harbor Tours 2026 — Ticket Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header {
      background: #fff; border-bottom: 1px solid #e0e0e0;
      padding: 18px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-left h1 { font-size: 1rem; font-weight: 600; }
    .header-left .subtitle { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .header-left .subtitle a { color: #0066cc; text-decoration: none; }
    #refresh-info { font-size: 0.75rem; color: #bbb; text-align: right; line-height: 1.6; }

    .container { max-width: 900px; margin: 0 auto; padding: 28px 24px; }

    /* ── Main question card ── */
    .question-card {
      background: #fff; border-radius: 14px; padding: 28px 32px;
      margin-bottom: 22px; border: 1px solid #e8e8e8;
      display: flex; align-items: center; gap: 24px;
    }
    .question-card .q { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 8px; }
    .question-card .answer { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .question-card .sub { font-size: 0.85rem; color: #666; margin-top: 6px; }
    .indicator { width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }

    .status-on_sale       .indicator { background: #d1fae5; }
    .status-likely_on_sale .indicator { background: #fef3c7; }
    .status-change_unrelated .indicator { background: #dbeafe; }
    .status-ok             .indicator { background: #f0f0f0; }
    .status-error          .indicator { background: #fee2e2; }
    .status-timeout        .indicator { background: #ffe4e6; }
    .status-selector_error .indicator { background: #fce7f3; }
    .status-loading        .indicator { background: #f0f0f0; }

    .status-on_sale        .answer { color: #065f46; }
    .status-likely_on_sale .answer { color: #92400e; }
    .status-change_unrelated .answer { color: #1e40af; }
    .status-ok             .answer { color: #444; }
    .status-error          .answer { color: #991b1b; }
    .status-timeout        .answer { color: #9f1239; }
    .status-selector_error .answer { color: #9d174d; }
    .status-loading        .answer { color: #aaa; }

    /* ── Stats row ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 22px;
    }
    .stat-card { background: #fff; border-radius: 10px; padding: 14px 18px; border: 1px solid #e8e8e8; }
    .stat-label { font-size: 0.7rem; color: #999; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 5px; }
    .stat-value { font-size: 1rem; font-weight: 600; }
    .stat-value.none { color: #aaa; font-weight: 400; font-size: 0.9rem; }
    .stat-value.positive { color: #065f46; }

    /* ── Log table ── */
    .log-card { background: #fff; border-radius: 10px; border: 1px solid #e8e8e8; overflow: hidden; }
    .log-header { padding: 13px 20px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; }
    .log-header h2 { font-size: 0.82rem; font-weight: 600; color: #555; }
    .log-count { font-size: 0.72rem; color: #bbb; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th { text-align: left; padding: 8px 16px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: #bbb; background: #fafafa; border-bottom: 1px solid #f0f0f0; }
    td { padding: 8px 16px; border-bottom: 1px solid #f7f7f7; vertical-align: top; }
    tr:last-child td { border-bottom: none; }

    tr.row-on_sale td:first-child        { border-left: 3px solid #10b981; }
    tr.row-likely_on_sale td:first-child  { border-left: 3px solid #f59e0b; }
    tr.row-change_unrelated td:first-child{ border-left: 3px solid #3b82f6; }
    tr.row-ok td:first-child              { border-left: 3px solid #d1d5db; }
    tr.row-error td:first-child           { border-left: 3px solid #ef4444; }
    tr.row-timeout td:first-child         { border-left: 3px solid #f43f5e; }
    tr.row-selector_error td:first-child  { border-left: 3px solid #ec4899; }

    .badge { display: inline-block; border-radius: 4px; padding: 1px 6px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .badge-on_sale         { background: #d1fae5; color: #065f46; }
    .badge-likely_on_sale  { background: #fef3c7; color: #92400e; }
    .badge-change_unrelated{ background: #dbeafe; color: #1e40af; }
    .badge-ok              { background: #f3f4f6; color: #6b7280; }
    .badge-error           { background: #fee2e2; color: #991b1b; }
    .badge-timeout         { background: #ffe4e6; color: #9f1239; }
    .badge-selector_error  { background: #fce7f3; color: #9d174d; }

    .note { color: #555; }
    .signals { margin-top: 3px; font-size: 0.72rem; color: #888; font-style: italic; }
    .empty { padding: 32px; text-align: center; color: #ccc; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Port of Oakland — Harbor Tours 2026</h1>
    <div class="subtitle">
      Monitoring <a href="https://www.portofoakland.com/community/harbor-tours" target="_blank">portofoakland.com/community/harbor-tours</a>
    </div>
  </div>
  <div id="refresh-info">
    Refreshing in <span id="countdown">60</span>s<br>
    <span id="last-updated" style="color:#ddd">—</span>
  </div>
</header>

<div class="container">

  <!-- Main question -->
  <div class="question-card status-loading" id="question-card">
    <div class="indicator" id="indicator">⏳</div>
    <div>
      <div class="q">Are 2026 Harbor Tours tickets on sale?</div>
      <div class="answer" id="answer">Loading…</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Last Check</div><div class="stat-value" id="stat-last-check">—</div></div>
    <div class="stat-card"><div class="stat-label">Checks Run</div><div class="stat-value" id="stat-total">—</div></div>
    <div class="stat-card"><div class="stat-label">Notable Events</div><div class="stat-value" id="stat-events">—</div></div>
    <div class="stat-card"><div class="stat-label">Last Change</div><div class="stat-value" id="stat-last-change">—</div></div>
    <div class="stat-card"><div class="stat-label">Monitoring Since</div><div class="stat-value" id="stat-uptime">—</div></div>
  </div>

  <!-- Log -->
  <div class="log-card">
    <div class="log-header">
      <h2>Check Log</h2>
      <span class="log-count" id="log-count"></span>
    </div>
    <table>
      <thead><tr><th>Time (PT)</th><th>Status</th><th>Detail</th></tr></thead>
      <tbody id="log-body"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

</div>

<script>
  const ANSWERS = {
    on_sale:          ['🎉 Yes — tickets are on sale!',   'An Eventbrite link has appeared. Go buy tickets now.'],
    likely_on_sale:   ['⚠️ Probably — check now',         'Strong signals detected. Scheduling or registration info may be available.'],
    change_unrelated: ['🔵 Unclear — page changed',       'Something changed on the page, but no ticket-sale signals were detected.'],
    ok:               ['Not yet',                          'No changes detected. The checker is running and watching.'],
    error:            ['Unknown — check error',            'An error occurred on the last check. See log for details.'],
    timeout:          ['Unknown — network timeout',        'The last check timed out. Retrying automatically.'],
    selector_error:   ['Unknown — page structure changed', 'The page layout may have changed. Manual inspection needed.'],
    loading:          ['Loading…',                         ''],
  };

  const ICONS = {
    on_sale: '🎉', likely_on_sale: '⚠️', change_unrelated: '🔵',
    ok: '✓', error: '✗', timeout: '⏱', selector_error: '⚙', loading: '⏳',
  };

  function render(data) {
    const status = data.status || 'ok';
    const [answer, sub] = ANSWERS[status] || ANSWERS.ok;

    const card = document.getElementById('question-card');
    card.className = `question-card status-${status}`;
    document.getElementById('indicator').textContent = ICONS[status] || '?';
    document.getElementById('answer').textContent = answer;
    document.getElementById('sub').textContent = sub;

    document.getElementById('last-updated').textContent = 'Updated ' + (data.last_updated || '—');
    document.getElementById('stat-last-check').textContent = data.last_check || '—';
    document.getElementById('stat-total').textContent = (data.stats?.total_checks ?? '—').toLocaleString();
    document.getElementById('stat-uptime').textContent = data.stats?.uptime_start || '—';

    const log = data.recent_log || [];
    const events = log.filter(e => e.result !== 'ok' && !['error','timeout','selector_error'].includes(e.result));
    document.getElementById('stat-events').textContent = events.length || '0';

    const lastChange = data.last_change;
    const lcEl = document.getElementById('stat-last-change');
    if (lastChange) {
      lcEl.textContent = lastChange;
      lcEl.className = 'stat-value positive';
    } else {
      lcEl.textContent = 'None yet';
      lcEl.className = 'stat-value none';
    }

    document.getElementById('log-count').textContent = log.length ? `${log.length} entries` : '';

    const tbody = document.getElementById('log-body');
    if (!log.length) {
      tbody.innerHTML = '<tr><td colspan="3" class="empty">No checks recorded yet.</td></tr>';
    } else {
      tbody.innerHTML = log.map(e => {
        const signalHtml = e.signals?.length
          ? `<div class="signals">Signals: ${e.signals.join(' · ')}</div>` : '';
        return `
          <tr class="row-${e.result}">
            <td style="white-space:nowrap">${e.time || ''}</td>
            <td><span class="badge badge-${e.result}">${e.result.replace(/_/g,' ')}</span></td>
            <td class="note">${e.note || ''}${signalHtml}</td>
          </tr>`;
      }).join('');
    }
  }

  function load() {
    fetch('status.json?t=' + Date.now())
      .then(r => r.json())
      .then(render)
      .catch(() => {
        document.getElementById('question-card').className = 'question-card status-loading';
        document.getElementById('answer').textContent = 'Waiting for first check…';
      });
  }

  let seconds = 60;
  setInterval(() => {
    seconds--;
    document.getElementById('countdown').textContent = seconds;
    if (seconds <= 0) { seconds = 60; load(); }
  }, 1000);

  load();
</script>
</body>
</html>
